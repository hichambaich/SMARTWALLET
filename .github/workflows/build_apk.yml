name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android files
        run: flutter create --project-name transparency_go . --platforms android

      - name: Force Gradle & Kotlin versions
        run: |
          # تحديث Gradle إلى 8.7
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          # تحديث إصدار Kotlin إلى 2.0.21
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" android/build.gradle
          
          # تحديث إصدار Kotlin في settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/settings.gradle

      - name: Fix Android Manifest Permissions
        run: |
          python -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
          if 'usesCleartextTraffic' not in content:
              content = content.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Set App Label
        run: |
          sed -i 's/android:label="[^"]*"/android:label="SMARTWALLET"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Clean Build
        run: flutter clean

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMARTWALLET-DEBUG
          path: build/app/outputs/flutter-apk/app-debug.apk

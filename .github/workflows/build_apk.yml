name: Build SMARTWALLET APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android folder
        run: flutter create --org com.smartwallet --project-name app --platforms android .



      - name: Setup Firebase & Force Compatible Versions
        run: |
          cp google-services.json android/app/
          
          python3 -c "
          import re
          
          # 1. إضافة إضافة Firebase إلى settings.gradle
          p = 'android/settings.gradle'
          with open(p, 'r') as f: c = f.read()
          if 'com.google.gms.google-services' not in c:
              c = c.replace('id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\"', 
                            'id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\"\n        id \"com.google.gms.google-services\" version \"4.4.1\" apply false')
          with open(p, 'w') as f: f.write(c)

          # 2. إضافة إضافة Firebase إلى app/build.gradle
          p2 = 'android/app/build.gradle'
          with open(p2, 'r') as f: c2 = f.read()
          if 'com.google.gms.google-services' not in c2:
              c2 = c2.replace('id \"dev.flutter.flutter-gradle-plugin\"', 
                              'id \"dev.flutter.flutter-gradle-plugin\"\n    id \"com.google.gms.google-services\"')
              with open(p2, 'w') as f: f.write(c2)
          "

      - name: Force Gradle, AGP, Kotlin, and SDK Versions
        run: |
          python3 -c "
          import re
          
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(p, 'r') as f: c = f.read()
          c = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\\\://services.gradle.org/distributions/gradle-8.7-bin.zip', c)
          with open(p, 'w') as f: f.write(c)

          p2 = 'android/settings.gradle'
          with open(p2, 'r') as f: c2 = f.read()
          c2 = re.sub(r'id \"com.android.application\" version \".*\"', 'id \"com.android.application\" version \"8.5.0\" apply false', c2)
          c2 = re.sub(r'id \"org.jetbrains.kotlin.android\" version \".*\"', 'id \"org.jetbrains.kotlin.android\" version \"2.0.10\" apply false', c2)
          with open(p2, 'w') as f: f.write(c2)

          p3 = 'android/app/build.gradle'
          with open(p3, 'r') as f: c3 = f.read()
          
          # Force SDK 35 and NDK 26
          c3 = re.sub(r'compileSdk\s*=\s*flutter.compileSdkVersion', 'compileSdk = 35', c3)
          c3 = re.sub(r'targetSdk\s*=\s*flutter.targetSdkVersion', 'targetSdk = 35', c3)
          c3 = re.sub(r'minSdk\s*=\s*flutter.minSdkVersion', 'minSdk = 23', c3)
          
          if 'ndkVersion' not in c3:
              c3 = c3.replace('compileSdk = 35', 'compileSdk = 35\n    ndkVersion = \"26.1.10909125\"')
              
          # Enable Desugaring (Required for flutter_local_notifications)
          if 'coreLibraryDesugaringEnabled' not in c3:
              if 'compileOptions {' in c3:
                  c3 = c3.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              else:
                  c3 = c3.replace('android {', 'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }')
                  
          # Add dependency directly at the end of the file to ensure it's present
          if 'coreLibraryDesugaring ' not in c3:
              c3 += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n'
              
          with open(p3, 'w') as f: f.write(c3)
          "

      - name: Fix Android Manifest (Permissions & Exported)
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: c = f.read()
          
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
          
          if 'android.permission.POST_NOTIFICATIONS' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <application')
              
          if 'usesCleartextTraffic' not in c:
              c = c.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
          if 'exported=' not in c and '<activity' in c:
              c = c.replace('<activity', '<activity android:exported=\"true\"')
          c = c.replace('android:label=\"app\"', 'android:label=\"SMARTWALLET\"')
          with open(path, 'w') as f: f.write(c)
          "

      - name: Download Custom Icon from Catbox
        run: wget -O web/icons/Icon-512.png "https://files.catbox.moe/7r3tcf.jpg"

      - name: Setup Launcher Icons
        run: |
          flutter pub add dev:flutter_launcher_icons
          cat << 'ICON_EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "web/icons/Icon-512.png"
            adaptive_icon_background: "#0B141E"
            adaptive_icon_foreground: "web/icons/Icon-512.png"
          ICON_EOF
          dart run flutter_launcher_icons


      - name: Enable Core Library Desugaring
        run: |
          python3 << 'INNEREOF'
          import re
          
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          
          # 1. تحديث compileSdk إلى 35
          content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35', content)
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
          
          # 2. تحديث ndkVersion إلى 26.1.10909125
          content = re.sub(r'ndkVersion\s*=\s*flutter\.ndkVersion', 'ndkVersion = "26.1.10909125"', content)
          content = re.sub(r'ndkVersion\s+"[^"]*"', 'ndkVersion "26.1.10909125"', content)
          if 'ndkVersion' not in content:
              content = content.replace('android {', 'android {\n    ndkVersion "26.1.10909125"', 1)
          
          # 3. تفعيل coreLibraryDesugaringEnabled
          if 'coreLibraryDesugaringEnabled' not in content:
              content = content.replace(
                  'compileOptions {',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true'
              )
          
          # 4. تحديث التبعية إلى 2.1.4
          content = re.sub(r'coreLibraryDesugaring\s+[\'"].*?[\'"]', 'coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\'', content)
          if 'desugar_jdk_libs' not in content:
              if 'dependencies {' in content:
                  content = content.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\''
                  )
              else:
                  content += '\n\ndependencies {\n    coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\'\n}\n'
          
          # إجبار استخدام debug keys بدلاً من release signing
          content = re.sub(r'signingConfigs\s*\{.*?\n    \}', '', content, flags=re.DOTALL)
          content = re.sub(r'signingConfig\s*=?\s*signingConfigs\.release', 'signingConfig signingConfigs.debug', content)
          if 'signingConfig signingConfigs.debug' not in content and 'signingConfig = signingConfigs.debug' not in content:
              content = content.replace('release {', 'release {\n            signingConfig signingConfigs.debug')

          with open(path, 'w') as f:
              f.write(content)
          print('DONE: compileSdk=35, ndkVersion=26.1.10909125, desugar=2.1.4')
          INNEREOF

      - name: Install dependencies
        run: flutter pub get

      - name: Clean Build
        run: flutter clean

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMARTWALLET-APK
          path: build/app/outputs/flutter-apk/app-release.apk

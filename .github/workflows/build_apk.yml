name: Build SMARTWALLET APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android folder
        run: flutter create --org com.smartwallet --project-name app --platforms android .


      - name: Enable Core Library Desugaring
        run: |
          python3 << 'INNEREOF'
          import re
          
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          
          # 1. تفعيل الميزة داخل compileOptions
          if 'coreLibraryDesugaringEnabled' not in content:
              content = content.replace(
                  'compileOptions {',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true'
              )
          
          # 2. إضافة التبعية داخل dependencies
          dep_line = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
          if 'desugar_jdk_libs' not in content:
              if 'dependencies {' in content:
                  content = content.replace(
                      'dependencies {',
                      'dependencies {\n    ' + dep_line
                  )
              else:
                  # في حال لم تكن dependencies موجودة (نادرة)
                  content += f'\n\ndependencies {{\n    {dep_line}\n}}\n'
          
          with open(path, 'w') as f:
              f.write(content)
          print('DONE: coreLibraryDesugaring enabled and dependency added')
          INNEREOF

      - name: Setup Firebase & Force Compatible Versions
        run: |
          cp google-services.json android/app/
          
          python3 -c "
          import re
          
          # 1. إضافة إضافة Firebase إلى settings.gradle
          p = 'android/settings.gradle'
          with open(p, 'r') as f: c = f.read()
          if 'com.google.gms.google-services' not in c:
              c = c.replace('id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\"', 
                            'id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\"\n        id \"com.google.gms.google-services\" version \"4.4.1\" apply false')
              with open(p, 'w') as f: f.write(c)

          # 2. إضافة إضافة Firebase إلى app/build.gradle
          p2 = 'android/app/build.gradle'
          with open(p2, 'r') as f: c2 = f.read()
          if 'com.google.gms.google-services' not in c2:
              c2 = c2.replace('id \"dev.flutter.flutter-gradle-plugin\"', 
                              'id \"dev.flutter.flutter-gradle-plugin\"\n    id \"com.google.gms.google-services\"')
              with open(p2, 'w') as f: f.write(c2)
          "

      - name: Force Gradle, AGP, Kotlin, and SDK Versions
        run: |
          python3 -c "
          import re
          
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(p, 'r') as f: c = f.read()
          c = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\\\://services.gradle.org/distributions/gradle-8.7-bin.zip', c)
          with open(p, 'w') as f: f.write(c)

          p2 = 'android/settings.gradle'
          with open(p2, 'r') as f: c2 = f.read()
          c2 = re.sub(r'id \"com.android.application\" version \".*\"', 'id \"com.android.application\" version \"8.5.0\" apply false', c2)
          c2 = re.sub(r'id \"org.jetbrains.kotlin.android\" version \".*\"', 'id \"org.jetbrains.kotlin.android\" version \"2.0.10\" apply false', c2)
          with open(p2, 'w') as f: f.write(c2)

          p3 = 'android/app/build.gradle'
          with open(p3, 'r') as f: c3 = f.read()
          c3 = re.sub(r'compileSdk\s*=\s*flutter.compileSdkVersion', 'compileSdk = 34', c3)
          c3 = re.sub(r'targetSdk\s*=\s*flutter.targetSdkVersion', 'targetSdk = 34', c3)
          c3 = re.sub(r'minSdk\s*=\s*flutter.minSdkVersion', 'minSdk = 23', c3)
          with open(p3, 'w') as f: f.write(c3)
          "

      - name: Fix Android Manifest (Permissions & Exported)
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: c = f.read()
          
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
          
          if 'android.permission.POST_NOTIFICATIONS' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <application')
              
          if 'usesCleartextTraffic' not in c:
              c = c.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
          if 'exported=' not in c and '<activity' in c:
              c = c.replace('<activity', '<activity android:exported=\"true\"')
          c = c.replace('android:label=\"app\"', 'android:label=\"SMARTWALLET\"')
          with open(path, 'w') as f: f.write(c)
          "

      - name: Install Pillow & Generate Icon
        run: |
          pip install Pillow
          python3 << 'INNEREOF'
          from PIL import Image
          import os
          
          ICON_SRC = 'web/icons/Icon-512.png'
          ANDROID_RES = 'android/app/src/main/res'
          densities = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          src = Image.open(ICON_SRC).convert('RGBA')

          # 1. Legacy icon (fills the frame)
          for d, s in densities.items():
              p = f'android/app/src/main/res/mipmap-{d}/ic_launcher.png'
              os.makedirs(os.path.dirname(p), exist_ok=True)
              src.resize((s, s), Image.LANCZOS).save(p)

          # 2. Adaptive icon (safe zone 66/108)
          for d, s in densities.items():
              p = f'android/app/src/main/res/mipmap-{d}/ic_launcher_foreground.png'
              fg = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              csize = int(s * 66 / 108)
              content = src.resize((csize, csize), Image.LANCZOS)
              off = (s - csize) // 2
              fg.paste(content, (off, off), content)
              fg.save(p)

          # 3. Adaptive XML
          anydpi = 'android/app/src/main/res/mipmap-anydpi-v26'
          os.makedirs(anydpi, exist_ok=True)
          with open(f'{anydpi}/ic_launcher.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      '    <background android:drawable="@color/ic_launcher_background" />\n'
                      '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
                      '</adaptive-icon>\n')

          # 4. Background color
          values = 'android/app/src/main/res/values'
          os.makedirs(values, exist_ok=True)
          colors = f'{values}/colors.xml'
          c_content = ''
          if os.path.exists(colors):
              with open(colors) as fh: c_content = fh.read()
          if 'ic_launcher_background' not in c_content:
              if not c_content.strip():
                  c_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources></resources>'
              c_content = c_content.replace('</resources>',
                  '    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>')
              with open(colors, 'w') as fh: fh.write(c_content)
          print('DONE: icons + adaptive + background generated')
          INNEREOF
      - name: Install dependencies
        run: flutter pub get

      - name: Clean Build
        run: flutter clean

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMARTWALLET-APK
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build SMARTWALLET APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android folder
        run: flutter create --org com.smartwallet --project-name app --platforms android .

      - name: Setup Firebase & Inject Plugins
        run: |
          # نسخ ملف إعدادات Firebase
          cp google-services.json android/app/
          
          # تعديل ملفات Gradle باستخدام Python لضمان الدقة
          python3 -c "
          # settings.gradle
          p = 'android/settings.gradle'
          with open(p, 'r') as f: c = f.read()
          if 'com.google.gms.google-services' not in c:
              c = c.replace('id \"dev.flutter.flutter-plugin-loader\"', 'id \"com.google.gms.google-services\" version \"4.4.1\" apply false\n        id \"dev.flutter.flutter-plugin-loader\"')
              with open(p, 'w') as f: f.write(c)

          # app/build.gradle
          p2 = 'android/app/build.gradle'
          with open(p2, 'r') as f: c2 = f.read()
          if 'com.google.gms.google-services' not in c2:
              c2 = c2.replace('id \"dev.flutter.flutter-gradle-plugin\"', 'id \"com.google.gms.google-services\"\n    id \"dev.flutter.flutter-gradle-plugin\"')
              with open(p2, 'w') as f: f.write(c2)
          "

      - name: Force Compatible Toolchain Versions
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.5.0" apply false/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.10" apply false/' android/settings.gradle

      - name: Fix Manifest (Permissions & Exported)
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: c = f.read()
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
          if 'usesCleartextTraffic' not in c:
              c = c.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
          if 'exported=' not in c and '<activity' in c:
              c = c.replace('<activity', '<activity android:exported=\"true\"')
          c = c.replace('android:label=\"app\"', 'android:label=\"SMARTWALLET\"')
          c = c.replace('android:label=\"transparency_go\"', 'android:label=\"SMARTWALLET\"')
          with open(path, 'w') as f: f.write(c)
          "

      - name: Install Pillow & Generate Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image
          import os
          src = Image.open('web/icons/Icon-512.png').convert('RGBA')
          densities = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in densities.items():
              p = f'android/app/src/main/res/mipmap-{d}/ic_launcher.png'
              os.makedirs(os.path.dirname(p), exist_ok=True)
              src.resize((s, s), Image.LANCZOS).save(p)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMARTWALLET-APK
          path: build/app/outputs/flutter-apk/app-release.apk

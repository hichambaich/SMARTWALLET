name: Build SMARTWALLET APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android platform
        run: flutter create --platforms android .

      - name: Install Pillow
        run: pip install Pillow

      - name: Set Custom Icon
        run: |
          python3 -c "
          from PIL import Image
          import os
          if os.path.exists('assets/icon.png'):
              src = Image.open('assets/icon.png').convert('RGBA')
          elif os.path.exists('web/icons/Icon-512.png'):
              src = Image.open('web/icons/Icon-512.png').convert('RGBA')
          else:
              print('Icon not found'); exit(1)
          densities = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in densities.items():
              p = f'android/app/src/main/res/mipmap-{d}/ic_launcher.png'
              os.makedirs(os.path.dirname(p), exist_ok=True)
              src.resize((s, s), Image.LANCZOS).save(p)
          "

      - name: Add Internet Permission
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: c = f.read()
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
          with open(path, 'w') as f: f.write(c)
          "

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMARTWALLET-APK
          path: build/app/outputs/flutter-apk/app-release.apk
